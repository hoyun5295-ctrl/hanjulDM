<style>
  :root {
    --color-primary: #F97316;
    --color-accent: #EF4444;
    --color-on-primary: #FFFFFF;
    --color-text-strong: #1B1410;
    --color-text-weak: #6B5E52;
    --color-bg: #EFE6D7;
    --color-soft: #F7F1E5;
    --color-card: #FFFCF7;
    --color-rule: #E0D4BD;
    --color-discount: #DC2626;
    --shadow-card: 0 1px 0 rgba(0,0,0,0.04), 0 10px 22px -10px rgba(60,40,20,0.20);

  html[data-season="newyear"]   { --color-primary:#DC2626; --color-accent:#CA8A04; }
  html[data-season="chuseok"]   { --color-primary:#1E40AF; --color-accent:#F59E0B; }
  html[data-season="christmas"] { --color-primary:#15803D; --color-accent:#DC2626; }
  html[data-season="summer"]    { --color-primary:#06B6D4; --color-accent:#0891B2; }
  html[data-season="winter"]    { --color-primary:#BE123C; --color-accent:#FB7185; }
  html[data-season="grand_open"]{ --color-primary:#1C1917; --color-accent:#FBBF24; }
  html[data-season="urgent"]    { --color-primary:#171717; --color-accent:#EF4444; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--color-bg); color: var(--color-text-strong); }
  body {
    font-family: 'Pretendard Variable', sans-serif; -webkit-font-smoothing: antialiased;

      repeating-linear-gradient(89deg, rgba(80, 50, 20, 0.035) 0 1px, transparent 1px 11px),
      radial-gradient(140% 60% at 50% 0%, rgba(140, 90, 50, 0.08), transparent 60%);

  }
  button { font-family: inherit; }
  .price-num { font-variant-numeric: tabular-nums; }

  /* ===== top bar minimal ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    height: 50px; padding: 0 14px;
    background: rgba(239, 230, 215, 0.85);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--color-rule);
    display: flex; align-items: center; gap: 8px;
  }
  .topbar .back, .topbar .iconbtn {
    width: 36px; height: 36px; border: 0; background: transparent;
    display: grid; place-items: center; color: var(--color-text-strong);
    cursor: pointer;
  }
  .topbar svg { width: 20px; height: 20px; }
  .topbar .crumbs {
    flex: 1; display: flex; flex-direction: column;
  }
  .topbar .crumbs .e1 { font-size: 10px; color: var(--color-text-weak); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
  .topbar .crumbs .e2 { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; margin-top: -2px; }

  /* ===== store card ===== */
  .store {
    margin: 16px 14px 4px;
    border-radius: 22px; overflow: hidden;
    position: relative; height: 220px;
    color: #fff;
    box-shadow: var(--shadow-card);
  }
  .store .bg {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.85) 100%),
      linear-gradient(135deg, #6b4f33 0%, #34221a 100%);
  }
  /* tiled shelf bg pattern */
  .store .bg::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(120% 60% at 20% 10%, rgba(255,200,150,0.18), transparent 60%),
      radial-gradient(120% 60% at 90% 30%, rgba(255,170,90,0.14), transparent 60%);
    mix-blend-mode: screen;
  }
  .store .seasonStamp {
    position: absolute; right: 14px; top: 14px;
    padding: 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.18); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.32);
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  }
  .store .content {
    position: absolute; inset: auto 18px 16px 18px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .store .name { font-size: 24px; font-weight: 900; letter-spacing: -0.025em; }
  .store .meta {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 600; opacity: 0.85;
  }
  .store .meta .star { color: #FBBF24; font-weight: 800; }
  .store .meta .sep { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.4); }
  .store .hours {
    margin-top: 6px;
    font-size: 12px; font-weight: 500; opacity: 0.85;
  }
  .store .hours .open {
    display: inline-flex; align-items: center; gap: 4px;
    color: #4ADE80; font-weight: 700;
  }
  .store .hours .open .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 8px #4ADE80; }
  .store .actions {
    margin-top: 12px; display: flex; gap: 8px;
  }
  .store .actions button {
    flex: 1; height: 38px; border-radius: 10px;
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 13px; font-weight: 700; letter-spacing: -0.01em;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; backdrop-filter: blur(6px);
  }
  .store .actions button svg { width: 14px; height: 14px; }
  .store .actions .primary {
    background: var(--color-primary); border-color: var(--color-primary);
    color: var(--color-on-primary);
  }

  /* ===== category row ===== */
  .row { padding-top: 22px; }
  .row .head {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 18px 10px;
  }
  .row .head .titles {
    display: flex; flex-direction: column;
  }
  .row .head .titles .cat {
    font-size: 21px; font-weight: 800; letter-spacing: -0.025em;
    display: inline-flex; align-items: baseline; gap: 6px;
  }
  .row .head .titles .cat small {
    font-size: 11px; font-weight: 600; color: var(--color-text-weak);
    letter-spacing: 0;
  }
  .row .head .titles .copy {
    font-size: 12px; color: var(--color-text-weak); margin-top: 2px;
  }
  .row .head .more {
    background: transparent; border: 0;
    font-size: 12px; font-weight: 700; color: var(--color-text-strong);
    display: inline-flex; align-items: center; gap: 4px;
    cursor: pointer;
  }
  .row .head .more svg { width: 12px; height: 12px; }

  /* shelf with wood plank */
  .shelf {
    position: relative;
    padding: 6px 0 22px;
  }
  .shelf::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: 12px;
    background:
      linear-gradient(180deg, rgba(80,55,25,0.18), rgba(80,55,25,0.04)),
      repeating-linear-gradient(90deg, rgba(120,80,40,0.10) 0 3px, transparent 3px 10px);
    border-top: 1px solid rgba(80,55,25,0.18);
  }

  .swipe {
    display: flex; gap: 12px;
    overflow-x: auto; padding: 4px 14px 0;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .swipe::-webkit-scrollbar { display: none; }
  .swipe::before, .swipe::after {
    content: ""; flex: 0 0 4px;
  }

  /* product card */
  .pcard {
    flex: 0 0 156px;
    scroll-snap-align: start;
    background: var(--color-card);
    border-radius: 16px;
    padding: 8px 8px 10px;
    box-shadow: var(--shadow-shelf);
    position: relative;
    transition: transform 200ms ease, filter 200ms ease, opacity 200ms ease;
    cursor: pointer;
  }
  .pcard.hold {
    transform: scale(1.12); z-index: 5;
    box-shadow: 0 24px 40px -12px rgba(0,0,0,0.4);
  }
  .row.holding .pcard:not(.hold) { filter: blur(2px); opacity: 0.4; }

  .pcard .pic {
    position: relative; aspect-ratio: 1/1;
    border-radius: 10px; overflow: hidden;
    background: var(--color-soft);
  }
  .ph { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ph-bg, #ddd); }
  .ph::after { content: var(--ph-emoji, ""); font-size: 86px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.18)); }

  .pcard .b1 {
    position: absolute; left: 6px; top: 6px;
    padding: 3px 7px; border-radius: 4px;
    background: var(--color-discount); color: #fff;
    font-size: 10px; font-weight: 800; letter-spacing: -0.01em;
  }
  .pcard .b1.tag { background: var(--color-text-strong); }

  .pcard .nm {
    margin-top: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: -0.01em;
    line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    min-height: 32px;
  }
  .pcard .unit { font-size: 10px; color: var(--color-text-weak); font-weight: 500; margin-top: 1px; }
  .pcard .price {
    display: flex; align-items: baseline; gap: 4px; margin-top: 4px;
  }
  .pcard .price .off { font-size: 12px; font-weight: 800; color: var(--color-discount); }
  .pcard .price .sale { font-size: 15px; font-weight: 900; letter-spacing: -0.02em; }
  .pcard .price .sale .won { font-size: 10px; font-weight: 800; }
  .pcard .orig { font-size: 11px; color: var(--color-text-weak); text-decoration: line-through; }

  /* expanded info that appears on hold */
  .pcard .more {
    position: absolute; left: 0; right: 0; top: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    background: var(--color-text-strong); color: #fff;
    border-radius: 12px;
    font-size: 11px; line-height: 1.5;
    opacity: 0; pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 200ms, transform 200ms;
    z-index: 6;
  }
  .pcard.hold .more { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .pcard .more .label { opacity: 0.6; text-transform: uppercase; letter-spacing: 0.06em; font-size: 9px; font-weight: 600; margin-right: 4px; }

  /* "more" sentinel card */
  .pcard.moreBtn {
    background: transparent;
    border: 2px dashed var(--color-rule);
    box-shadow: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--color-text-weak);
  }
  .pcard.moreBtn .pic { background: transparent; }
  .pcard.moreBtn .pic .icon {
    position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px;
  }

  /* swipe indicator */
  .swipeIndicator {
    height: 3px; border-radius: 2px;
    background: var(--color-rule);
    margin: 0 18px;
    overflow: hidden; position: relative;
  }
  .swipeIndicator .thumb {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 32%; min-width: 14%;
    background: var(--color-text-strong); border-radius: 2px;
    transition: left 100ms linear, width 200ms ease;
  }

  /* footer brand */
  .brand {
    margin: 24px 18px 0;
    padding-top: 18px;
    border-top: 1px solid var(--color-rule);
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--color-text-weak);
    letter-spacing: 0.1em;
  }
  .brand strong { color: var(--color-text-strong); font-weight: 800; letter-spacing: -0.01em; }

  @media (prefers-reduced-motion: reduce) {
    .pcard, .row.holding .pcard:not(.hold), .pcard .more { transition: none; }
  }
</style>
</head>

          <div class="copy">"${cat.copy}"</div>
        </div>
        <button class="more">더 보기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="shelf">
        <div class="swipe" data-row="${ci}"></div>
      </div>
      <div class="swipeIndicator"><div class="thumb"></div></div>
    `;
    const swipe = row.querySelector('.swipe');
    cat.items.forEach(it => {
      const card = document.createElement('article');
      card.className = 'pcard';
      const off = Math.round((1 - it.salePrice/it.originalPrice) * 100);
      card.innerHTML = `
        <div class="pic">
          <div class="ph" style="--ph-bg:${it.bg}; --ph-emoji:'${it.emoji}';"></div>
          <span class="b1 ${it.badge.includes('한정') || it.badge.includes('1+1') ? 'tag' : ''}">${it.badge}</span>
        </div>
        <div class="nm">${it.name}</div>
        <div class="unit">${it.unit} · ${it.origin}</div>
        <div class="price">
          <span class="off">${off}%</span>
          <span class="sale price-num">${fmt(it.salePrice)}<span class="won">원</span></span>
        </div>
        <div class="orig price-num">${fmt(it.originalPrice)}원</div>
        <div class="more">
          <div><span class="label">한 줄</span>${it.aiCopy || ''}</div>
          <div style="margin-top:6px;"><span class="label">원산지</span>${it.origin}</div>
          ${it.cardDiscount ? `<div style="margin-top:4px;"><span class="label">카드</span>${it.cardDiscount}</div>` : ''}
        </div>
      `;

      // long-press → hold class
      let lpTimer, holding = false;
      const start = (e) => {
        lpTimer = setTimeout(() => {
          holding = true;
          row.classList.add('holding');
          card.classList.add('hold');
        }, 350);
      };
      const end = () => {
        clearTimeout(lpTimer);
        if (holding) {
          holding = false;
          setTimeout(() => {
            row.classList.remove('holding');
            card.classList.remove('hold');
          }, 1400);
        }
      };
      card.addEventListener('pointerdown', start);
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => card.addEventListener(ev, end));
      swipe.appendChild(card);
    });

    // "more" sentinel
    const sentinel = document.createElement('article');
    sentinel.className = 'pcard moreBtn';
    sentinel.innerHTML = `
      <div class="pic"><span class="icon">→</span></div>
      <div class="nm" style="text-align:center; min-height: 32px; display:flex; align-items:center; justify-content:center;">전체 ${cat.count}개<br>보기</div>
      <div class="unit" style="text-align:center;">${cat.name}</div>
    `;
    swipe.appendChild(sentinel);

    // swipe indicator
    const thumb = row.querySelector('.thumb');
    function updateThumb() {
      const w = swipe.scrollWidth - swipe.clientWidth;
      const p = w > 0 ? swipe.scrollLeft / w : 0;
      const tw = Math.max(14, (swipe.clientWidth / swipe.scrollWidth) * 100);
      thumb.style.width = tw + '%';
      thumb.style.left = (p * (100 - tw)) + '%';
    }
    swipe.addEventListener('scroll', updateThumb, { passive: true });
    requestAnimationFrame(updateThumb);

    main.appendChild(row);
  });

  // season
  const seasonParam = new URLSearchParams(location.search).get('season');
  if (seasonParam) document.documentElement.setAttribute('data-season', seasonParam);
  window.addEventListener('message', (ev) => {
    const d = ev.data || {};
    if (d.type === 'season' && d.value) document.documentElement.setAttribute('data-season', d.value);
  });
</script>
</body>
</html>
